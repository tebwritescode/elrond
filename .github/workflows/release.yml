# Publishes this implementation's container image to Docker Hub.
#
# Two independent Elrond implementations share one GitHub repository and one
# Docker Hub image, distinguished only by branch and tag. See docs/publishing.md
# for the whole convention.
#
# This file belongs to the `alt` branch and must only ever publish `alt-*` tags.
# A workflow on a branch only runs for events on that branch, so the two
# implementations' workflows never contend, provided each keeps its trigger
# scoped to its own branch.
#
# Credentials come from repository or organization secrets and never appear here.
# Only DOCKER_PASSWORD is secret; the image name deliberately is not, because a
# masked image name renders every log line as ***/*** and makes a failed publish
# impossible to diagnose.

name: Release (alt)

on:
  push:
    # Scoped to this implementation's branch. Widening this would make the two
    # builds fight over the same Docker tags.
    branches: [alt]
    tags: ['v*-alt.beta']
  workflow_dispatch:

concurrency:
  group: release-alt-${{ github.ref }}
  cancel-in-progress: false

env:
  # One shared image; the tag is what separates the implementations.
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE || 'tebwritescode/elrond' }}

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The `secrets` context is not available in a step-level `if`, so presence is
      # captured here, where it is available, and tested as a plain env value.
      HAS_DOCKER_CREDENTIALS: ${{ secrets.DOCKER_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      # Emulation, needed only for the multi-architecture path. Skipped on a
      # branch build, where nothing but amd64 is produced.
      - uses: docker/setup-qemu-action@v3
        if: startsWith(github.ref, 'refs/tags/')

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Moving tag: always the newest alt build.
            type=raw,value=alt-beta
            # Immutable per-release tag, e.g. 0.1.0-alt.beta, from a git tag.
            type=semver,pattern={{version}}
          flavor: |
            # `latest` is never published from this branch. Both implementations
            # are in beta; whichever is promoted claims `latest` deliberately, not
            # as a side effect of a build.
            latest=false

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # A tagged release ships every architecture. A branch build ships only
          # amd64, because arm64 is emulated under QEMU and compiling this Rust
          # workspace a second time that way turns a few minutes into the better
          # part of an hour — too slow to sit between a push and a testable image.
          platforms: >-
            ${{ startsWith(github.ref, 'refs/tags/')
                && 'linux/amd64,linux/arm64'
                || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # A software bill of materials and build provenance, so what shipped can
          # be audited after the fact.
          sbom: true
          provenance: mode=max

      - name: Scan the published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Scanned by digest, so this is provably the image just pushed rather
          # than whatever a shared tag happens to point at by now.
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          # Unfixed advisories are reported but do not fail the build: there is no
          # action to take on them, and a permanently red pipeline gets ignored.
          ignore-unfixed: true

      - name: Summarise what was published
        run: |
          {
            echo "### Published"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Image | \`${IMAGE_NAME}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Tags | \`${TAGS//$'\n'/\`, \`}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
