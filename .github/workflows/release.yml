# TEMPLATE for the PRIMARY implementation.
#
# This file is not active where it sits. Copy it to `.github/workflows/release.yml`
# on the `main` branch of github.com/tebwritescode/elrond. It lives on the `alt`
# branch only because that branch holds the shared coordination documents; see
# docs/publishing.md.
#
# It is the alt branch's release workflow with four lines changed: the name, the
# trigger branch and tag pattern, the concurrency group, and the moving Docker
# tag. Everything else is deliberately identical so the two implementations
# publish comparable artefacts.
#
# Credentials come from repository or organization secrets and never appear here.
# Only DOCKER_PASSWORD is secret; the image name deliberately is not, because a
# masked image name renders every log line as ***/*** and makes a failed publish
# impossible to diagnose.

name: Release

on:
  push:
    # Scoped to this implementation's branch. Widening this would make the two
    # builds fight over the same Docker tags.
    branches: [main]
    tags: ['v*-beta']
  workflow_dispatch:

concurrency:
  group: release-main-${{ github.ref }}
  cancel-in-progress: false

env:
  # One shared image; the tag is what separates the implementations.
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE || 'tebwritescode/elrond' }}
  # Beta builds prioritize feedback speed. Stable tags retain full platform
  # coverage when the stable trigger is enabled after promotion.
  PLATFORMS: ${{ (github.ref_type == 'branch' || endsWith(github.ref_name, '-beta')) && 'linux/amd64' || 'linux/amd64,linux/arm64' }}

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The `secrets` context is NOT available in a step-level `if`. Presence is
      # captured here, where it is available, and tested as a plain env value.
      # Getting this wrong produces a workflow that fails to parse.
      HAS_DOCKER_CREDENTIALS: ${{ secrets.DOCKER_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      # Emulation for the arm64 build. Native arm64 runners would be faster, but
      # this keeps the workflow runnable on the standard hosted pool.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Moving tag: always the newest primary build.
            type=raw,value=beta
            # Immutable per-release tag, e.g. 0.1.0-beta, from a git tag.
            type=semver,pattern={{version}}
          flavor: |
            # `latest` is never published while both implementations are in beta.
            # Whichever is promoted claims it deliberately, not as a side effect
            # of a build.
            latest=false

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Scan the published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # By digest, not by tag: this provably scans what was just pushed rather
          # than whatever the shared tag points at by the time the scan runs.
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Summarise what was published
        run: |
          {
            echo "### Published"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Image | \`${IMAGE_NAME}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Tags | \`${TAGS//$'\n'/\`, \`}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
