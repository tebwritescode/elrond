services:
  elrond:
    image: ${ELROND_IMAGE:-elrond:local}
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${ELROND_PORT:-3000}:3000"
    environment:
      ELROND_SECURE_COOKIES: ${ELROND_SECURE_COOKIES:-false}
      STIRLING_URL: ${STIRLING_URL:-}
      STIRLING_API_KEY: ${STIRLING_API_KEY:-}
    volumes:
      - elrond-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  elrond-data:
