[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/tebwritescode/elrond"
description = "Self-hosted document library for immutable originals, controlled PDF versions, and reproducible professional binders."

[workspace.dependencies]
elrond-domain = { path = "crates/domain" }
elrond-application = { path = "crates/application" }
elrond-infrastructure = { path = "crates/infrastructure" }
elrond-api = { path = "crates/api" }

anyhow = "1.0"
argon2 = { version = "0.5", features = ["std"] }
dotenvy = "0.15"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64ct = { version = "1.8", features = ["alloc"] }
hex = "0.4"
http = "1"
# Identifies file types from magic bytes, so a filename can never decide how a
# stored file is treated.
infer = { version = "0.19", default-features = false }
mime_guess = "2"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
    "time",
    "uuid",
] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "fs", "set-header", "limit", "compression-gzip"] }
tracing = "0.1"
# The `time` feature supplies the UTC RFC 3339 log timestamps.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The docs in this workspace are written as prose and name real products
# (Axum, SQLite, PostgreSQL, Stirling-PDF). Backticking those would misrepresent
# them as code identifiers.
doc_markdown = "allow"
# `users::UserRepository` reads better than `users::Repository` at call sites.
module_name_repetitions = "allow"
# Errors and panics are documented where the reason is non-obvious rather than
# uniformly, and the `# Errors` section boilerplate adds no information when the
# error type is already explicit.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
