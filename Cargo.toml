[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/application",
  "crates/infrastructure",
  "crates/api",
  "crates/server",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tebwritescode/Elrond"
rust-version = "1.97"

[workspace.dependencies]
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["multipart"] }
deunicode = "1.6.2"
dotenvy = "0.15.7"
hex = "0.4.3"
lopdf = "0.44.0"
rand = "0.9.2"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "multipart", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate"] }
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal", "fs", "time", "sync"] }
tower-http = { version = "0.6.8", features = ["fs", "trace", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.19.0", features = ["v4"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
tempfile = "3.24.0"
